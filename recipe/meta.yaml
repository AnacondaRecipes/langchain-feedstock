{% set name = "langchain" %}
{% set version = "1.4.2" %}
{% set ignore_tests = " --ignore=tests/unit_tests" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/integration_tests/chat_models/test_base.py" %}
{% set tests_to_deselect = " --deselect=tests/integration_tests/agents/middleware/test_shell_tool_integration.py::test_shell_tool_basic_execution[openai]" %}
{% set tests_to_deselect = 'tests_to_deselect + " --deselect=tests/integration_tests/agents/middleware/test_human_in_the_loop_integration.py::test_hitl_reject_does_not_retry[openai]"' %}

# E   ModuleNotFoundError: No module named 'blockbuster'
# E   ModuleNotFoundError: No module named 'langchain_tests'
# E openai.OpenAIError: The api_key client option must be set either by passing api_key to the client or by setting the OPENAI_API_KEY environment variable
# E openai.OpenAIError: The api_key client option must be set
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5b476418cacbfb8f0da6e63b3b263eefdcec13b48abd6117565a25728ec10b77

build:
  number: 0
  skip: true  # [py<3100]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - langchain-server = langchain.server:main

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - langchain-core >=1.6.3,<2.0.0
    - langgraph >=1.2.11,<1.3.0
    - pydantic >=2.7.4,<3.0.0
  run_constrained:
    - langchain-baseten >=0.2.0
    - fastmcp >=4.0.1,<5.0.0

test:
  source_files:
    - tests
  imports:
    - langchain.agents
    - langchain.chat_models
    - langchain.embeddings
    - langchain.messages
    - langchain.tools
    - langchain.rate_limiters
  requires:
    - pip
    - pytest >=9.0.3,<10.0.0
    - pytest-cov >=4.0.0,<8.0.0
    - pytest-asyncio >=1.3.0,<2.0.0
    - pytest-socket >=0.6.0,<1.0.0
    - pytest-xdist >=3.6.1,<4.0.0
    - pytest-mock
    - pytest-benchmark >=5.1.0,<6.0.0
    - toml >=0.10.2,<1.0.0
    - langchain-openai
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - python -m pytest -vv tests {{ ignore_tests }} {{ tests_to_deselect }}

about:
  home: https://github.com/langchain-ai/langchain
  doc_url: https://docs.langchain.com
  dev_url: https://github.com/langchain-ai/langchain/tree/master/libs/langchain_v1
  summary: Building applications with LLMs through composability
  description: |
    LangChain is a framework for developing applications powered by language models (LLMs).
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - YYYasin19
